name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]


jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0

      # ── Validate repo structure ──────────────────────────────────────
      - name: Check required files exist
        run: |
          test -f README.md || (echo "README.md missing" && exit 1)
          echo "Repo structure OK"

      # ── Repository script tests ──────────────────────────────────────
      - name: Install test evidence dependencies
        run: python3 -m pip install --requirement scripts/requirements-test-evidence.txt
      - name: Backlog hygiene checker tests
        run: python3 -m unittest scripts/tests/test_check_issue_hygiene.py
      - name: Acoustic wake reliability runner tests
        run: |
          python3 -m py_compile scripts/acoustic_wake_reliability_runner.py
          python3 -m unittest scripts.tests.test_acoustic_wake_reliability_runner

      - name: Android 16 KB checker tests
        run: python3 -m unittest scripts.tests.test_check_android_16kb_artifacts

      # ── Android build ──────────────────────────────────────────────
      - name: Set up JDK 21
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699
        with:
          packages: platform-tools ndk;28.2.13676358

      - name: Verify pinned NDK installation
        env:
          NDK_VERSION: 28.2.13676358
        run: |
          NDK_DIR="$ANDROID_HOME/ndk/$NDK_VERSION"
          NDK_PROPERTIES="$NDK_DIR/source.properties"
          if [ ! -f "$NDK_PROPERTIES" ]; then
            echo "::error::Pinned NDK $NDK_VERSION is incomplete: $NDK_PROPERTIES is missing"
            exit 1
          fi
          if ! grep -Eq "^Pkg\\.Revision[[:space:]]*=[[:space:]]*${NDK_VERSION}$" "$NDK_PROPERTIES"; then
            echo "::error::Pinned NDK revision does not match $NDK_VERSION in $NDK_PROPERTIES"
            exit 1
          fi

      - name: Cache Gradle packages
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Cache Sherpa-ONNX AAR
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae
        with:
          path: third_party/sherpa-onnx
          key: sherpa-onnx-aar-1.13.0

      - name: Download Sherpa-ONNX AAR
        run: |
          mkdir -p third_party/sherpa-onnx
          AAR=third_party/sherpa-onnx/sherpa-onnx-1.13.0.aar
          if [ ! -f "$AAR" ]; then
            echo "Downloading Sherpa-ONNX AAR…"
            curl -fL -o "$AAR" \
              https://github.com/k2-fsa/sherpa-onnx/releases/download/v1.13.0/sherpa-onnx-1.13.0.aar
            echo "Downloaded $(du -sh "$AAR" | cut -f1) AAR"
          else
            echo "AAR already present (cached)"
          fi

      - name: Build (debug)
        continue-on-error: true
        id: gradle-build
        env:
          DEVICE_TEST_VERSION_CODE_BASE: 1000000000
        run: |
          DEVICE_TEST_VERSION_CODE=$((DEVICE_TEST_VERSION_CODE_BASE + GITHUB_RUN_NUMBER))
          if (( DEVICE_TEST_VERSION_CODE >= 2100000000 )); then
            echo "Device-test versionCode exceeds Android's supported maximum" >&2
            exit 1
          fi
          ./gradlew assembleDebug -PversionCode="$DEVICE_TEST_VERSION_CODE"
      - name: Build debug instrumentation and release artifacts
        env:
          DEVICE_TEST_VERSION_CODE_BASE: 1000000000
        run: |
          DEVICE_TEST_VERSION_CODE=$((DEVICE_TEST_VERSION_CODE_BASE + GITHUB_RUN_NUMBER))
          if (( DEVICE_TEST_VERSION_CODE >= 2100000000 )); then
            echo "Device-test versionCode exceeds Android's supported maximum" >&2
            exit 1
          fi
          cat > app/src/androidTest/AndroidManifest.xml <<EOF
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              android:versionCode="$DEVICE_TEST_VERSION_CODE"
              android:versionName="0.1.0" />
          EOF
          ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest \
            -PversionCode="$DEVICE_TEST_VERSION_CODE"
          ./gradlew :feature:settings:assembleDebugAndroidTest :app:assembleRelease \
            :app:bundleRelease -PversionCode=${{ github.run_number }}
      - name: Test device APK provenance helper
        run: |
          python3 -m py_compile scripts/create_device_test_apk_manifest.py
          python3 -m unittest scripts.tests.test_create_device_test_apk_manifest

      - name: Verify Android 16 KB APK and AAB artifacts
        run: |
          BUNDLETOOL="$RUNNER_TEMP/bundletool-all-1.18.3.jar"
          curl --fail --location --retry 3 --retry-delay 2 \
            --output "$BUNDLETOOL" \
            https://github.com/google/bundletool/releases/download/1.18.3/bundletool-all-1.18.3.jar
          python3 scripts/check_android_16kb_artifacts.py \
            --sdk-root "$ANDROID_HOME" \
            --bundletool "$BUNDLETOOL" \
            --apk app/build/outputs/apk/debug/app-debug.apk \
            --apk app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk \
            --apk feature/settings/build/outputs/apk/androidTest/debug/settings-debug-androidTest.apk \
            --apk app/build/outputs/apk/release/app-release-unsigned.apk \
            --aab app/build/outputs/bundle/release/app-release.aab

      - name: Lint
        continue-on-error: true
        id: gradle-lint
        run: ./gradlew lint

      - name: Unit tests
        continue-on-error: true
        id: gradle-unit-tests
        run: |
          ./gradlew :core:memory:testDebugUnitTest :core:skills:testDebugUnitTest :core:voice:testDebugUnitTest :feature:chat:testDebugUnitTest :app:testDebugUnitTest :feature:settings:testDebugUnitTest
          ./gradlew :core:inference:testDebugUnitTest --tests com.kernel.ai.core.inference.LiteRtInferenceEngineResponseFormatTest

      - name: Upload test results
        if: always() && (github.event_name != 'pull_request' || !contains(github.event.pull_request.labels.*.name, 'ci-validation-only'))
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: test-results-${{ github.sha }}
          path: '**/build/reports/tests/'
          retention-days: 14

      - name: Upload APK
        if: success() && (github.event_name != 'pull_request' || !contains(github.event.pull_request.labels.*.name, 'ci-validation-only'))
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: apk-${{ github.sha }}
          path: app/build/outputs/apk/debug/
          retention-days: 14

      - name: Generate paired device-test APK provenance
        if: success() && (github.event_name != 'pull_request' || !contains(github.event.pull_request.labels.*.name, 'ci-validation-only'))
        env:
          DEVICE_TEST_VERSION_CODE_BASE: 1000000000
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          python3 scripts/create_device_test_apk_manifest.py \
            --repository "$GITHUB_REPOSITORY" \
            --pull-request "${PR_NUMBER:-0}" \
            --event "$GITHUB_EVENT_NAME" \
            --source-head-sha "${{ github.event.pull_request.head.sha || github.sha }}" \
            --merge-sha "$GITHUB_SHA" \
            --run-id "$GITHUB_RUN_ID" \
            --run-number "$GITHUB_RUN_NUMBER" \
            --version-code-base "$DEVICE_TEST_VERSION_CODE_BASE" \
            --sdk-root "$ANDROID_HOME" \
            --app-apk app/build/outputs/apk/debug/app-debug.apk \
            --test-apk app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk \
            --output device-test-apk-manifest.json
      - name: Upload paired device-test APKs and provenance
        if: success() && (github.event_name != 'pull_request' || !contains(github.event.pull_request.labels.*.name, 'ci-validation-only'))
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: device-test-apks-${{ github.sha }}
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            device-test-apk-manifest.json
          if-no-files-found: error
          retention-days: 30
      # ── CI test evidence ─────────────────────────────────────────────
      - name: Generate CI test evidence
        if: always()
        run: |
          PR_NUM="${{ github.event.pull_request.number }}"
          python3 scripts/generate_ci_test_evidence.py \
            --out-dir /tmp/ci-evidence \
            --commit ${{ github.sha }} \
            --branch ${{ github.ref_name }} \
            ${PR_NUM:+--pr "$PR_NUM"} \
            --report "gradle_build=${{ steps.gradle-build.outcome == 'success' && '0' || '1' }}" \
            --report "gradle_lint=${{ steps.gradle-lint.outcome == 'success' && '0' || '1' }}" \
            --report "unit_tests=${{ steps.gradle-unit-tests.outcome == 'success' && '0' || '1' }}"

      - name: Upload CI test evidence
        if: always() && (github.event_name != 'pull_request' || !contains(github.event.pull_request.labels.*.name, 'ci-validation-only'))
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ci-test-evidence-${{ github.sha }}
          path: /tmp/ci-evidence/
          retention-days: 30

      - name: Retire PR preview comment for validation-only run
        if: always() && github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'ci-validation-only')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          EXISTING_ID=$(gh api --paginate --slurp \
            "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments?per_page=100" \
            | jq -r '[.[][] | select(.body | startswith("<!-- pr-apk-comment -->"))][0].id // empty')
          if [ -z "$EXISTING_ID" ]; then
            echo "No PR preview comment to retire"
            exit 0
          fi

          jq -n --arg pr "$PR_NUMBER" --arg sha "$PR_HEAD_SHA" '{
            body: ("<!-- pr-apk-comment -->\n## Preview retired for validation-only run\n\nPR #" + $pr + " has the `ci-validation-only` label. This run for commit `" + $sha + "` did not publish a debug APK preview. Any previous preview link is stale and must not be used for this head.")
          }' > /tmp/pr-comment.json

          gh api "repos/${GITHUB_REPOSITORY}/issues/comments/${EXISTING_ID}" \
            -X PATCH --input /tmp/pr-comment.json
      - name: Publish PR preview APK
        if: ${{ success() && github.event_name == 'pull_request' && !github.event.pull_request.draft && !contains(github.event.pull_request.labels.*.name, 'ci-validation-only') }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          SHORT_SHA=${GITHUB_SHA::7}
          TAG="pr-${PR_NUMBER}"

          # Upsert the pr-N pre-release (create; if exists, update APK + metadata)
          gh release create "$TAG" "$APK" \
            --title "PR #${PR_NUMBER} debug build — ${SHORT_SHA}" \
            --notes "Debug APK for PR #${PR_NUMBER}. Commit: ${GITHUB_SHA}. Build #${BUILD_NUMBER}." \
            --prerelease 2>/dev/null \
          || {
            git tag -f "$TAG"
            git push -f origin "$TAG"
            # Replace the previous preview artifact before uploading this build.
            gh release delete-asset "$TAG" app-debug.apk --yes 2>/dev/null || true
            gh release upload "$TAG" "$APK"
            gh release edit "$TAG" \
              --title "PR #${PR_NUMBER} debug build — ${SHORT_SHA}" \
              --notes "Debug APK for PR #${PR_NUMBER}. Commit: ${GITHUB_SHA}. Build #${BUILD_NUMBER}." \
              --prerelease
          }

          APK_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/app-debug.apk"

          # Build comment JSON via printf+python — avoids YAML block-scalar indentation issues
          printf '<!-- pr-apk-comment -->\n## Debug APK ready\n\n**[Download app-debug.apk](%s)**\n\nCommit: `%s` - Build #%s\n\n_Updated on each push. Removed when PR is merged or closed._\n' \
            "$APK_URL" "$SHORT_SHA" "$BUILD_NUMBER" \
            | python3 -c "import json,sys; print(json.dumps({'body':sys.stdin.read()}))" \
            > /tmp/pr-comment.json

          # Post or update sticky comment (identified by marker in first line)
          EXISTING_ID=$(gh api "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" \
            --jq '[.[] | select(.body | startswith("<!-- pr-apk-comment -->"))][0].id // empty')
          if [ -n "$EXISTING_ID" ]; then
            gh api "repos/${GITHUB_REPOSITORY}/issues/comments/${EXISTING_ID}" \
              -X PATCH --input /tmp/pr-comment.json
          else
            gh api "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" \
              -X POST --input /tmp/pr-comment.json
          fi

      - name: Publish debug release
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          SHORT_SHA=${GITHUB_SHA::7}

          # Look up the PR(s) associated with this commit (squash-merge lands as a single commit)
          PR_JSON=$(gh api repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls \
            -H "Accept: application/vnd.github+json" 2>/dev/null || echo "[]")

          PR_NUMBER=$(echo "$PR_JSON" | python3 -c \
            "import sys,json; prs=json.load(sys.stdin); print(prs[0]['number'] if prs else '')" 2>/dev/null)
          PR_TITLE=$(echo "$PR_JSON" | python3 -c \
            "import sys,json; prs=json.load(sys.stdin); print(prs[0]['title'] if prs else '')" 2>/dev/null)
          PR_BODY=$(echo "$PR_JSON" | python3 -c \
            "import sys,json; prs=json.load(sys.stdin); print(prs[0]['body'] or '' if prs else '')" 2>/dev/null)

          if [ -n "$PR_NUMBER" ]; then
            RELEASE_TITLE="Debug build ${SHORT_SHA} — ${PR_TITLE}"
            RELEASE_NOTES="## PR #${PR_NUMBER}: ${PR_TITLE}

          ${PR_BODY}

          ---
          **Commit:** \`${GITHUB_SHA}\`
          **Build:** #${{ github.run_number }}"
          else
            # Direct push to main (no associated PR)
            COMMIT_MSG=$(git log -1 --pretty=format:"%s" $GITHUB_SHA)
            RELEASE_TITLE="Debug build ${SHORT_SHA} — ${COMMIT_MSG}"
            RELEASE_NOTES="Direct push to main (no associated PR).

          **Commit:** \`${GITHUB_SHA}\`
          **Message:** ${COMMIT_MSG}
          **Build:** #${{ github.run_number }}"
          fi

          # Delete existing debug-latest tag/release if present
          gh release delete debug-latest --repo $GITHUB_REPOSITORY --yes 2>/dev/null || true
          git tag -f debug-latest
          git push -f origin debug-latest
          gh release create debug-latest "$APK" \
            --repo $GITHUB_REPOSITORY \
            --title "$RELEASE_TITLE" \
            --notes "$RELEASE_NOTES" \
            --prerelease
