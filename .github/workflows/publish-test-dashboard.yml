name: Publish test dashboard

on:
  workflow_dispatch:
  repository_dispatch:
    types:
      - test-evidence-published
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout main
        uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0
        with:
          path: repo

      - name: Checkout test-results
        id: checkout_test_results
        continue-on-error: true
        uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0
        with:
          ref: test-results
          path: test-results
          fetch-depth: 1

      - name: Install test evidence dependencies
        run: python3 -m pip install --requirement repo/scripts/requirements-test-evidence.txt

      - name: Assess evidence store
        id: evidence_store
        if: always()
        continue-on-error: true
        run: |
          if [ "${{ steps.checkout_test_results.outcome }}" != "success" ] || [ ! -d test-results/results ]; then
            {
              echo "state=unavailable"
              echo "reason=The test-results branch could not be checked out with a results/ directory."
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          python3 - <<'PY'
          import os
          import sys
          from pathlib import Path

          sys.path.insert(0, "repo/scripts")
          from summarise_test_evidence_metrics import discover_evidence

          output = Path(os.environ["GITHUB_OUTPUT"])
          try:
              records = discover_evidence(Path("test-results/results"))
              parseable = sum(record is not None for _, record, _ in records)
              if not records:
                  state = "empty"
                  reason = "The test-results store is valid but contains no evidence records."
              elif not parseable:
                  state = "unavailable"
                  reason = "The test-results store contains no readable JSON evidence records."
              else:
                  state = "available"
                  reason = "The test-results store loaded successfully."
          except Exception as exc:
              state = "unavailable"
              reason = f"The test-results store could not be validated: {exc}"

          output.write_text(f"state={state}\nreason={reason}\n")
          PY

      - name: Build dashboard
        run: |
          cd repo
          python3 scripts/build_test_dashboard.py \
            --results-dir ../test-results/results \
            --out-dir _site \
            --evidence-store-state "${{ steps.evidence_store.outputs.state || 'unavailable' }}" \
            --evidence-store-reason "${{ steps.evidence_store.outputs.reason || 'The evidence store could not be assessed.' }}"

      - name: Stage non-draft legal documents
        id: stage_legal
        run: |
          set -euo pipefail
          # Build from a fresh allowlist, never from the repository root.
          source=repo/.legal-pages-source
          mkdir -p "$source/_layouts"
          cat > "$source/_config.yml" <<'EOF'
          markdown: kramdown
          EOF
          cat > "$source/_layouts/legal.html" <<'EOF'
          <!doctype html>
          <html lang="en">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <title>{{ page.title | escape }} — Jandal AI</title>
          </head>
          <body>
            <main>
              {{ content }}
            </main>
          </body>
          </html>
          EOF
          python3 - <<'PY'
          import os
          from pathlib import Path

          source = Path("repo/.legal-pages-source")
          repo = os.environ["GITHUB_REPOSITORY"]
          repo_name = repo.split("/", 1)[1]
          pages = (
              ("PRIVACY.md", "Privacy Policy", "/privacy/"),
              ("TERMS.md", "Terms of Use", "/terms/"),
              ("BETA.md", "Join the beta", "/beta/"),
          )
          staged = []
          for filename, title, permalink in pages:
              original = Path("repo") / filename
              if not original.is_file():
                  continue
              content = original.read_text()
              if "draft for owner" in content.lower():
                  print(f"Skipping draft document: {filename}")
                  continue
              if filename == "BETA.md" and (
                  "TESTER_GROUP_LINK" in content
                  or "](https://groups.google.com/" not in content
              ):
                  print(f"Skipping {filename}: no tester group link yet")
                  continue
              content = content.replace(
                  "(PRIVACY.md)", f"(/{repo_name}/privacy/)"
              ).replace(
                  "(TERMS.md)", f"(/{repo_name}/terms/)"
              ).replace(
                  "(LICENSE)",
                  f"(https://github.com/{repo}/blob/main/LICENSE)",
              ).replace(
                  "(NOTICE)",
                  f"(https://github.com/{repo}/blob/main/NOTICE)",
              )
              page = source / filename
              page.write_text(
                  f"---\nlayout: legal\ntitle: {title}\npermalink: {permalink}\n---\n"
                  + content
              )
              staged.append(filename)

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"present={str(bool(staged)).lower()}\n")
          print("Staged non-draft documents: " + (", ".join(staged) if staged else "no non-draft legal files are ready yet"))
          PY

      - name: Render non-draft legal documents
        if: steps.stage_legal.outputs.present == 'true'
        uses: actions/jekyll-build-pages@44a6e6beabd48582f863aeeb6cb2151cc1716697 # v1
        with:
          source: ./repo/.legal-pages-source
          destination: ./repo/.legal-pages-build

      - name: Add legal documents to Pages artifact
        if: steps.stage_legal.outputs.present == 'true'
        run: |
          set -euo pipefail
          if [[ -d repo/.legal-pages-build/privacy ]]; then
            cp -R repo/.legal-pages-build/privacy repo/_site/privacy
          fi
          if [[ -d repo/.legal-pages-build/terms ]]; then
            cp -R repo/.legal-pages-build/terms repo/_site/terms
          fi
          if [[ -d repo/.legal-pages-build/beta ]]; then
            cp -R repo/.legal-pages-build/beta repo/_site/beta
          fi

      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa
        with:
          path: repo/_site

      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e


      - name: Fail visibly when evidence is unavailable
        if: steps.evidence_store.outputs.state == 'unavailable'
        run: |
          echo "::error::Evidence unavailable; the deployed dashboard is an explicit error state."
          exit 1
